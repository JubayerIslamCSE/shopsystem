<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Supplier Form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container my-4">
  <h2 th:text="${supplier.id == null} ? 'New Supplier' : 'Edit Supplier'">Supplier</h2>
  <form th:action="@{/suppliers/save}" th:object="${supplier}" method="post" class="mt-3" style="max-width:600px">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" th:field="*{name}">
      <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="text" class="form-control" th:field="*{email}">
      <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input type="text" class="form-control" th:field="*{phone}">
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <textarea class="form-control" th:field="*{address}" rows="2"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a th:href="@{/suppliers}" class="btn btn-secondary">Cancel</a>
  </form>
</main>
</body>
</html>
