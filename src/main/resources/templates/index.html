<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container my-4">
  <h2 class="mb-4">Dashboard</h2>
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card text-bg-primary"><div class="card-body">
        <h6 class="card-title">Products</h6>
        <p class="display-6 mb-0" th:text="${productCount}">0</p>
      </div></div>
    </div>
    <div class="col-md-3">
      <div class="card text-bg-success"><div class="card-body">
        <h6 class="card-title">Categories</h6>
        <p class="display-6 mb-0" th:text="${categoryCount}">0</p>
      </div></div>
    </div>
    <div class="col-md-3">
      <div class="card text-bg-info"><div class="card-body">
        <h6 class="card-title">Suppliers</h6>
        <p class="display-6 mb-0" th:text="${supplierCount}">0</p>
      </div></div>
    </div>
    <div class="col-md-3">
      <div class="card text-bg-warning"><div class="card-body">
        <h6 class="card-title">Inventory Value</h6>
        <p class="display-6 mb-0" th:text="${#numbers.formatDecimal(inventoryValue,1,2)}">0.00</p>
      </div></div>
    </div>
  </div>

  <h4 class="mb-3">Low Stock Alerts</h4>
  <div th:if="${#lists.isEmpty(lowStock)}" class="alert alert-success">
    All products are above their reorder level. 🎉
  </div>
  <table th:unless="${#lists.isEmpty(lowStock)}" class="table table-bordered">
    <thead class="table-light">
    <tr><th>Product</th><th>SKU</th><th>In Stock</th><th>Reorder Level</th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${lowStock}">
      <td th:text="${p.name}"></td>
      <td th:text="${p.sku}"></td>
      <td class="text-danger fw-bold" th:text="${p.quantity}"></td>
      <td th:text="${p.reorderLevel}"></td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>
