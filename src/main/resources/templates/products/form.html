<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Product Form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container my-4">
  <h2 th:text="${product.id == null} ? 'New Product' : 'Edit Product'">Product</h2>
  <form th:action="@{/products/save}" th:object="${product}" method="post" class="mt-3" style="max-width:700px">
    <input type="hidden" th:field="*{id}">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" th:field="*{name}">
        <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">SKU</label>
        <input type="text" class="form-control" th:field="*{sku}">
        <div class="text-danger small" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Category</label>
        <select class="form-select" th:field="*{categoryId}">
          <option value="">-- Select --</option>
          <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Supplier</label>
        <select class="form-select" th:field="*{supplierId}">
          <option value="">-- Select --</option>
          <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
        </select>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Price</label>
        <input type="number" step="0.01" class="form-control" th:field="*{price}">
        <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Quantity in Stock</label>
        <input type="number" class="form-control" th:field="*{quantity}">
        <div class="text-danger small" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Reorder Level</label>
        <input type="number" class="form-control" th:field="*{reorderLevel}">
        <div class="text-danger small" th:if="${#fields.hasErrors('reorderLevel')}" th:errors="*{reorderLevel}"></div>
      </div>
      <div class="col-12 mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" th:field="*{description}" rows="2"></textarea>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
  </form>
</main>
</body>
</html>
