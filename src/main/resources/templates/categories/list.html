<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Categories</h2>
    <a th:href="@{/categories/new}" class="btn btn-primary">+ New Category</a>
  </div>
  <table class="table table-striped">
    <thead><tr><th>Name</th><th>Description</th><th style="width:160px">Actions</th></tr></thead>
    <tbody>
    <tr th:each="c : ${categories}">
      <td th:text="${c.name}"></td>
      <td th:text="${c.description}"></td>
      <td>
        <a th:href="@{/categories/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
        <a th:href="@{/categories/{id}/delete(id=${c.id})}" class="btn btn-sm btn-outline-danger"
           onclick="return confirm('Delete this category?')">Delete</a>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(categories)}">
      <td colspan="3" class="text-center text-muted">No categories yet.</td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>
