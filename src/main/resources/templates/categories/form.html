<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Category Form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container my-4">
  <h2 th:text="${category.id == null} ? 'New Category' : 'Edit Category'">Category</h2>
  <form th:action="@{/categories/save}" th:object="${category}" method="post" class="mt-3" style="max-width:600px">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" th:field="*{name}">
      <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a th:href="@{/categories}" class="btn btn-secondary">Cancel</a>
  </form>
</main>
</body>
</html>
